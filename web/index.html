<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>와일드 프론티어 Java 포트</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font-family: sans-serif; text-align: center; }
  #status { color: #fc6; margin-top: 16px; }
  /* The window is 416x312 plus a title bar; the extra height keeps it clear of CheerpJ's banner. */
  #display { width: 480px; height: 500px; margin: 8px auto; }
  p { line-height: 1.6; }
</style>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
</head>
<body>
<p id="status">Java 런타임을 불러오는 중… (처음에는 1분쯤 걸립니다)</p>
<div id="display"></div>
<p>조작: 방향키 이동, Enter 확인·대화, F 대화 빨리 넘기기, 1 공격, 2 물약, F5 저장, F9 불러오기.
저장은 이 브라우저에 남습니다. <a href="https://github.com/Camof1ow/wawa-java">소스</a></p>
<script type="module">
  // CheerpJ serves this page's directory under /app/; the jar and the APK sit next to index.html,
  // and Java opens the APK in place through its zip file system (HTTP range reads).
  const base = "/app" + location.pathname.replace(/[^/]*$/, "");
  await cheerpjInit({ version: 17, status: "splash", javaProperties: ["wawa.save=/files/wawa-slot"] });
  document.getElementById("status").textContent = "화면을 한 번 누르면 키보드로 조작할 수 있습니다.";
  cheerpjCreateDisplay(-1, -1, document.getElementById("display"));
  await cheerpjRunMain("wawa.Game", base + "wawa.jar", base + "wild.apk");
</script>
</body>
</html>
