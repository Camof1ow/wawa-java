<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>와일드 프론티어 Java 포트</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  #status { margin: 4px 8px; font-size: 13px; color: #fc6; }
  /* The game fills what is left of the page and scales itself to it, keeping its aspect. */
  #display { flex: 1; min-height: 0; }
</style>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
</head>
<body>
<div id="status">Java 런타임을 불러오는 중… (처음에는 1분쯤 걸립니다)</div>
<div id="display"></div>

  // and Java opens the APK in place through its zip file system (HTTP range reads).

    version: 17,
    status: "splash",

  document.getElementById("status").innerHTML =
    "화면을 한 번 누른 뒤 조작: 방향키 이동, Enter 확인·대화, F 빨리 넘기기, 1 공격, 2 물약, F5 저장, F9 불러오기 · " +
